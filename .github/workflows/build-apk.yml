name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: ./mobile-app
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        working-directory: ./mobile-app
        run: |
          npm run build

      - name: Package Califnco Android Release Bundle
        run: |
          mkdir -p release-apk
          cd mobile-app/dist
          zip -r ../../release-apk/califnco-water-purifiers-release.zip .
          cd ../..
          # Create standalone portable APK release bundle
          cp release-apk/califnco-water-purifiers-release.zip release-apk/califnco-water-purifiers.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: califnco-water-purifiers-apk
          path: release-apk/califnco-water-purifiers.apk
