name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies
        working-directory: ./mobile-app
        run: |
          npm install --include=dev --legacy-peer-deps

      - name: Build Web Assets & Sync to Android
        working-directory: ./mobile-app
        run: |
          npx vite build
          npx @capacitor/cli sync android

      - name: Fix Line Endings and Permissions on Gradlew
        working-directory: ./mobile-app/android
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: ./mobile-app/android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: |
          mkdir -p release-apk
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk release-apk/califnco-water-purifiers.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: califnco-water-purifiers-apk
          path: release-apk/califnco-water-purifiers.apk
